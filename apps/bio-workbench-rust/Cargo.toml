[package]
name = "bio-workbench-rust"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "Native desktop for cloud molecular prediction and comparison"

[dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "__screenshot"] }

bytemuck = "=1.25.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
base64 = "=0.22.1"
uuid = { version = "=1.18.1", features = ["v4"] }
tempfile = "=3.23.0"
rfd = "=0.17.2"
fs2 = "=0.4.3"
libc = "0.2"
image = { version = "=0.25.10", default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSObject", "NSString", "NSAppleEventManager", "NSAppleEventDescriptor", "objc2-core-services"] }

[profile.release]
opt-level = 2
debug = false
